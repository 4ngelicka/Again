<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGAIN – Mobile Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6f5;--sf:#fff;--ink:#172827;--mute:#5a7371;--line:#d6e5e3;--br:#087e83;--brk:#fff;--tint:#dff0ef;--deep:#172827;--dk:#eef6f5;--wm:#b4560f;--wmb:#fdeee0;--er:#b3261e;--erb:#fde7e5;--ok:#1d7a4a;--okb:#dff3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1818;--sf:#122625;--ink:#e8f3f2;--mute:#8fa9a6;--line:#1f3a39;--br:#3fc1c6;--brk:#06292a;--tint:#16393a;--deep:#0d2d2e;--dk:#e8f3f2;--wm:#f0a068;--wmb:#3a2514;--er:#ff9b93;--erb:#3b1a18;--ok:#6fd1a0;--okb:#123325;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1818;--sf:#122625;--ink:#e8f3f2;--mute:#8fa9a6;--line:#1f3a39;--br:#3fc1c6;--brk:#06292a;--tint:#16393a;--deep:#0d2d2e;--dk:#e8f3f2;--wm:#f0a068;--wmb:#3a2514;--er:#ff9b93;--erb:#3b1a18;--ok:#6fd1a0;--okb:#123325;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:500px){#app{height:min(880px,96vh);margin:auto;border:1px solid var(--line);border-radius:30px}}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.015em}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--line)}
.tile{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.tile img{width:28px;height:28px}
header .t{flex:1;line-height:1.2}header .t b{font:700 15px 'Bricolage Grotesque',sans-serif}
main{flex:1;overflow-y:auto;padding:18px 16px 28px}
h1{font-size:25px;line-height:1.15;margin-bottom:4px}.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g{display:flex;gap:11px;align-items:center;min-width:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--br);display:grid;place-items:center;font:700 14px 'Bricolage Grotesque',sans-serif}
.nm{font-weight:600}.mt{color:var(--mute);font-size:13px}.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--wmb);color:var(--wm);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.gr{background:var(--tint);color:var(--mute)}.pill.er{background:var(--erb);color:var(--er)}.pill.bl{background:var(--tint);color:var(--br)}
button{font:600 14px Figtree,sans-serif;border-radius:11px;padding:10px 14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer}
button.p{background:var(--br);color:var(--brk);border-color:var(--br)}button.w{width:100%}button.sm{padding:7px 11px;font-size:13px}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--br);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1;min-width:90px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}.chips button{border-radius:99px;padding:6px 13px;font-size:13px;white-space:nowrap}.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{display:flex;border-top:1px solid var(--line);background:var(--sf);padding:6px 4px}
nav button{flex:1;border:0;background:none;font-size:11.5px;font-weight:500;color:var(--mute);padding:6px 2px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--br);font-weight:600}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav b{position:absolute;top:0;right:20%;background:var(--wm);color:var(--sf);font-size:11px;border-radius:99px;padding:0 6px}
.hero{background:var(--deep);color:#eef6f5;border-radius:22px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:16px}
.hero .mt{color:#9fc5c2}.hero h2{font-size:21px;line-height:1.15;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px}.stats strong{display:block;font:700 22px 'Bricolage Grotesque',sans-serif}.stats span{font-size:12px;color:var(--mute)}
.sheet{position:absolute;inset:0;background:rgba(5,22,22,.55);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--sf);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@media(prefers-reduced-motion:reduce){.sheet>div{animation:none}}
.toast{position:absolute;left:16px;right:16px;bottom:82px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:13px;font-size:14px;z-index:9}
.bar{height:8px;background:var(--tint);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--br)}
.back{border:0;background:none;color:var(--br);padding:0 0 12px}
.hist{border-left:2px solid var(--tint);padding:0 0 12px 12px;margin-left:4px}
.chk{display:flex;gap:8px;font-size:13px;margin:3px 0}.chk i{font-style:normal;color:var(--ok);font-weight:700}.chk i.x{color:var(--er)}
.lg{background:#fff;border-radius:18px;padding:10px 16px;margin-bottom:18px;display:inline-block}.lg img{width:210px;display:block}
.login{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.err{color:var(--er);font-size:13px;margin:-6px 0 10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.bk button.on{background:var(--br);color:var(--brk);border-color:var(--br)}
</style>
</head>

function pill(c){if(c.st=='optout')return'<span class="pill gr">Opted out</span>';if(c.st=='draft')return'<span class="pill er">Draft · add contact</span>';const f=c.fu,p=SP[f.s];return f.s=='due'?`<span class="pill ${f.o<0?'er':''}">${f.o<0?-f.o+' days overdue':'Due '+fd(f.o)}</span>`:`<span class="pill ${p[1]}">${p[0]}</span>`}
function approve(id){const c=C(id);S.sheet=null;if(c.st!='active')return toast('Blocked: add a valid contact and permission first');if(S.left<1)return toast('Monthly reminder limit reached');
 S.left--;c.fu.n++;const m={c:id,n:c.n,k:c.fu.n,st:'accepted'};S.msgs.push(m);c.fu.s='accepted';log('Approved reminder #'+c.fu.n+' → '+c.n);toast('Approved. Waiting for the email provider');
 setTimeout(()=>{m.st=id==3&&!c.rt?'failed':'delivered';c.fu.s=m.st;draw()},1600)}

function nx(id){const c=C(id);if(c.fu.s=='delivered'){c.fu.s=c.fu.n>=2?'closed':'noreply';log('14 days, no reply → '+c.n)}else S.sheet={t:'rev',id};draw()}

function optout(id){const c=C(id);if(c.st=='optout'){c.st='active';log('Reminders re-enabled → '+c.n)}else{c.st='optout';if(['due','accepted'].includes(c.fu.s))c.fu.s='none';S.msgs.push({c:id,n:c.n,k:0,st:'suppressed'});log('Opt-out recorded, queued sends cancelled → '+c.n)}toast(c.st=='optout'?'Opt-out saved. Queued sends cancelled':'Reminders turned back on')}
function addC(){const n=$('#fn').value.trim(),ph=$('#fp').value.trim();if(!n){$('#fe').textContent='Enter the customer’s name.';return}
 const c={id:S.nid++,n,a:$('#fa').value||'Malolos',ph,u:'Not set',st:ph?'active':'draft',fu:{s:'none',n:0,o:0},h:[]};S.cust.unshift(c);S.sheet=null;log('Added customer '+n);toast(ph?'Customer saved':'Saved as draft. Dispatch is blocked until contact and permission are added')}
function recS(id){const c=C(id),a=+$('#ra').value||0,o=+$('#ro').value;c.h.unshift({d:fd(0),s:$('#rs').value+' · '+c.u,a,man:1});c.fu={s:'due',n:0,o};if(o>20)c.fu.s='none';c.fu.o=o;S.man++;S.sheet=null;log('Recorded service (manual) → '+c.n);toast('Service recorded. Next follow-up '+fd(o))}
function rq(id,a,x){const r=R(id),c=C(r.cid);if(a=='ok'){r.s='ok';log('Confirmed booking → '+r.c)}
 if(a=='alt'){r.s='alt';r.t=x;S.sheet=null;log('Proposed '+x+' → '+r.c)}if(a=='acc'){r.s='ok';r.t=r.t;log('Customer accepted proposed time → '+r.c)}
 if(a=='no'){r.s='no';r.why=x;S.sheet=null;log('Declined request → '+r.c)}
 if(a=='cx'){r.s='cx';log('Cancelled / no-show → '+r.c)}
 if(a=='done'){r.s='done';c.h.unshift({d:fd(0),s:'Cleaning · '+c.u,a:1200,bid:r.id});c.fu={s:'none',n:0,o:182};log('Service completed, linked to request → '+r.c)}
 toast({ok:'Booking confirmed',alt:'Time proposed. Waiting for customer',acc:'Customer accepted',no:'Request declined',cx:'Marked cancelled. History unchanged',done:'Service recorded and linked to the request'}[a]);}
function book(id){const c=C(id),t=$('#bd').dataset.v+' · '+$('#bt').dataset.v;if(S.req.some(r=>r.cid==id&&r.s=='new')){return toast('You already have a pending request')}
 S.req.unshift({id:S.nid++,cid:id,c:c.n,t,s:'new'});if(c.fu.s=='due'||c.fu.s=='delivered'||c.fu.s=='noreply')c.fu.s='requested';log('Booking request received ← '+c.n);S.page='sent';draw()}

function main(){
 if(S.scr=='login')return`<main class="login"><div class="lg"><img src="${LOGO}" alt="AGAIN – Bring your customers back"></div><h1>Log in to your business</h1><p class="sub">Accounts are set up for you during onboarding. Passwords are never stored in plain text.</p><label for="em">Email</label><input id="em" value="owner@example.com"><label for="pw">Password</label><input id="pw" type="password" value="password123"><button class="p w" onclick="S.scr='app';S.role='owner';S.tab='today';draw()">Log in as owner</button><div class="btns"><button onclick="S.scr='app';S.role='staff';S.tab='today';draw()">Log in as staff</button><button onclick="S.sheet={t:'rst'};draw()">Forgot password</button></div><p class="mt" style="text-align:center;margin-top:14px">Prototype · all records are synthetic</p></main>`;

function today(){const d=dueL(),all=S.cust.filter(c=>c.st!='optout'&&c.fu.s!='none').length,done=all-d.length,pc=all?done/all:0,L=2*Math.PI*34;
 const f={all:()=>1,od:c=>c.fu.o<0,wk:c=>c.fu.o>=0,fx:c=>c.st=='draft'}[S.flt];const l=d.filter(f);

 <div class="stats"><div><strong>${d.filter(c=>c.fu.o<0).length}</strong><span>Overdue</span></div><div><strong>${S.msgs.filter(m=>m.st=='delivered').length}</strong><span>Delivered</span></div><div><strong>${S.req.filter(r=>r.s=='new').length}</strong><span>New requests</span></div></div>
 <div class="chips">${[['all','All'],['od','Overdue'],['wk','This week'],['fx','Needs contact']].map(x=>`<button class="${S.flt==x[0]?'on':''}" onclick="S.flt='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>
 ${l.length?l.map(c=>`<div class="card"><div class="row"><div class="g"><div class="av">${ini(c.n)}</div><div style="min-width:0"><div class="nm tr">${c.n}</div><div class="mt tr">${c.u} · last ${c.h[0]?c.h[0].d:'—'}</div></div></div>${pill(c)}</div><div class="btns"><button class="p" onclick="S.sheet={t:'rev',id:${c.id}};draw()">Review reminder</button><button onclick="S.open=${c.id};draw()">Profile</button></div></div>`).join(''):'<div class="card mt">Nothing in this filter. Record a completed service to start the next follow-up.</div>'}</main>`}
function custs(){const q=(S.q||'').toLowerCase(),l=S.cust.filter(c=>(c.n+c.a).toLowerCase().includes(q)&&(S.cf=='all'||(S.cf=='op'?c.st=='optout':c.st=='draft')));
 return`<main><div class="row"><h1>Customers</h1><button class="p sm" onclick="S.sheet={t:'add'};draw()">Add</button></div><p class="sub">${S.cust.length+S.imp} of 1,000 contacts</p><input placeholder="Search name or barangay" value="${S.q||''}" oninput="S.q=this.value;draw();const i=$('input');i.focus();i.setSelectionRange(99,99)" aria-label="Search customers"><div class="chips">${[['all','All'],['dr','Drafts'],['op','Opted out']].map(x=>`<button class="${S.cf==x[0]?'on':''}" onclick="S.cf='${x[0]}';draw()">${x[1]}</button>`).join('')}<button onclick="S.sheet={t:'imp'};draw()">Import CSV</button></div>
 ${l.map(c=>`<div class="card" onclick="S.open=${c.id};draw()" style="cursor:pointer"><div class="row"><div class="g"><div class="av">${ini(c.n)}</div><div style="min-width:0"><div class="nm tr">${c.n}</div><div class="mt tr">${c.a} · ${c.u}</div></div></div>${pill(c)}</div></div>`).join('')||'<p class="mt">No customers match. Try another name or filter.</p>'}</main>`}

 <div class="btns" style="margin-top:0"><button class="p" onclick="S.sheet={t:'rec',id:${c.id}};draw()">Record service</button><button onclick="S.sheet={t:'link',id:${c.id}};draw()">Booking link</button><button onclick="optout(${c.id})">${c.st=='optout'?'Allow reminders':'Opt out'}</button></div>
 <h3 style="margin:20px 0 10px">Service history</h3>${c.h.length?c.h.map(h=>`<div class="hist"><div class="nm">${h.s}</div><div class="mt">${h.d} · ₱${h.a.toLocaleString()} recorded${h.bid?' · linked to booking':h.man?' · manual entry':''}</div></div>`).join(''):'<p class="mt">No services yet. Record the first completed job.</p>'}
 <h3 style="margin:18px 0 10px">Message log</h3>${lm.length?lm.map(m=>`<div class="row" style="padding:6px 0"><span>${m.k?'Reminder #'+m.k:'Opt-out'}</span><span class="pill ${m.st=='delivered'?'ok':m.st=='failed'?'er':'gr'}">${m.st}</span></div>`).join(''):'<p class="mt">No messages yet.</p>'}</main>`}

 if(s.t=='alt')return x(`<h3>Propose another time</h3><div class="btns" style="flex-direction:column">${['Sun, Nov 15 · 9:00 AM','Mon, Nov 16 · 1:00 PM','Tue, Nov 17 · 9:00 AM'].map(t=>`<button onclick="rq(${s.id},'alt','${t}')">${t}</button>`).join('')}${cl}</div>`);
 if(s.t=='no')return x(`<h3>Decline request</h3><div class="btns" style="flex-direction:column">${['Fully booked that day','Outside service area','Other reason'].map(t=>`<button onclick="rq(${s.id},'no','${t}')">${t}</button>`).join('')}${cl}</div>`);
 if(s.t=='imp')return x(`<h3>Import preview</h3><p class="mt" style="margin:4px 0 10px">12 rows checked before anything is saved.</p><table><tr><th>Check</th><th>Rows</th></tr><tr><td>Valid, with consent info</td><td>9</td></tr><tr><td>Possible duplicates</td><td>2</td></tr><tr><td>Invalid mobile number</td><td>1</td></tr></table><div class="btns">${cl}<button class="p" onclick="S.imp+=9;S.sheet=null;log('Imported 9 customers from CSV');toast('9 rows imported. 3 skipped')">Import 9 valid rows</button></div>`);
 return x(`<h3>Reset password</h3><p class="mt" style="margin:4px 0 12px">We’ll email a one-time reset link to your verified address.</p><input value="owner@example.com" aria-label="Email"><div class="btns">${cl}<button class="p" onclick="S.sheet=null;toast('Reset link sent')">Send link</button></div>`)}
draw();
</script>
</body>
</html>
